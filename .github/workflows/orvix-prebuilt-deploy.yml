name: ORVIX Prebuilt Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/orvix-prebuilt-deploy.yml

permissions:
  contents: read

jobs:
  deploy-prebuilt:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not configured in this GitHub repository."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Link existing ORVIX Vercel project
        run: vercel link --yes --project=orvix-websits --scope=eyaddasfour56-labs-projects --token="$VERCEL_TOKEN"

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production output on GitHub
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
