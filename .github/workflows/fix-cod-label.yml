name: Fix COD shipping label

on:
  push:
    branches:
      - fix/cod-label
    paths:
      - .github/workflows/fix-cod-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cod-label
          fetch-depth: 0

      - name: Apply COD label patch
        run: python scripts/fix-cod-label.py

      - name: Verify patch
        run: |
          git diff --check
          git diff -- app/admin/page.tsx

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx
          git commit -m "Fix cash on delivery label amounts"
          git push origin HEAD:fix/cod-label
