name: ORVIX Quality & Price Sync

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync checkout and order base price
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/sync-product-price.mjs

      - name: Build Next.js application
        run: npm run build

      - name: Commit synced files when needed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git add package-lock.json app/checkout/page.tsx app/api/order/route.ts

          if git diff --cached --quiet; then
            echo "Lockfile and price are already synced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync dependency lockfile and Fitbit base price"
          git push
