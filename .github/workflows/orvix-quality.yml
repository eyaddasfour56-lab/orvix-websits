name: ORVIX Quality & Price Sync

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync checkout and order base price
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/sync-product-price.mjs

      - name: Build Next.js application
        run: npm run build

      - name: Commit synced price when needed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Price already synced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/checkout/page.tsx app/api/order/route.ts
          git commit -m "Sync Fitbit base price to 8500 EGP"
          git push
